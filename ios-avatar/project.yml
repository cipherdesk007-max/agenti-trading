name: AvatarFit
options:
  bundleIdPrefix: com.avatarfit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  # caricatore glTF per il personaggio CC0 (SCNSkinner supportato, MIT)
  GLTFSceneKit:
    url: https://github.com/magicien/GLTFSceneKit
    from: 0.4.1
targets:
  AvatarFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: GLTFSceneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avatarfit.app
        PRODUCT_NAME: AvatarFit
        MARKETING_VERSION: "1.1.11"
        CURRENT_PROJECT_VERSION: "11"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Serve per la scansione del viso (TrueDepth) dell'avatar 3D: resta solo su questo iPhone."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Serve per prendere l'ultimo selfie (o il Memoji che hai salvato) dalla galleria e applicarlo come volto dell'avatar: resta solo su questo iPhone, Nessun invio."
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  AvatarFitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: AvatarFit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.avatarfit.tests
