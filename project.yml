name: QuantSwarmAlphaZero
options:
  bundleIdPrefix: com.quantswarm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      OTHER_SWIFT_FLAGS: "$(inherited) -whole-module-optimization"
targets:
  QuantSwarmAlphaZero:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - excludes: ["Sources/Widget/**"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantswarm.alphazero
        PRODUCT_NAME: QuantSwarmAlphaZero
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/App/QuantSwarmAlphaZero.entitlements
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreLocation.framework
      - sdk: Security.framework
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: UserNotifications.framework
      - sdk: WidgetKit.framework
      - target: QuantSwarmWidgetExtension
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: QuantSwarm Alpha Zero
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.quantswarm.alphazero.refresh]
        NSFaceIDUsageDescription: "Face ID protegge l'accesso alle credenziali API salvate nel Keychain."
        NSLocationWhenInUseUsageDescription: "La posizione è usata solo durante la sessione di trading esplicitamente avviata; non viene simulata alcuna navigazione."
        NSLocationAlwaysAndWhenInUseUsageDescription: "L'accesso continuo consente aggiornamenti di sessione in background quando consentiti da iOS; non garantisce un WebSocket permanente."
        ITSAppUsesNonExemptEncryption: false
    scheme:
      gatherCoverageData: false
  QuantSwarmWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantswarm.alphazero.widget
        PRODUCT_NAME: QuantSwarmWidget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/QuantSwarmWidgetExtension.entitlements
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: Generated/WidgetInfo.plist
      properties:
        CFBundleDisplayName: QuantSwarm Status
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  QuantSwarmAlphaZero:
    build:
      targets:
        QuantSwarmAlphaZero: all
        QuantSwarmWidgetExtension: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
