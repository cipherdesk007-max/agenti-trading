name: QuantSwarmAlphaZero
options:
  bundleIdPrefix: com.quantswarm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      OTHER_SWIFT_FLAGS: "$(inherited) -whole-module-optimization"
targets:
  QuantSwarmAlphaZero:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - "Widget/**"
          - "Sources/Widget/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantswarm.alphazero
        PRODUCT_NAME: QuantSwarmAlphaZero
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/App/QuantSwarmAlphaZero.entitlements
    dependencies:
      - sdk: Security.framework
      - sdk: SwiftUI.framework
      - sdk: Charts.framework
      - sdk: SwiftData.framework
      - sdk: UserNotifications.framework
      - sdk: WidgetKit.framework
      - target: QuantSwarmWidgetExtension
        embed: true
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: QuantSwarm Alpha Zero
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: "Face ID protegge l'accesso alle credenziali API salvate nel Keychain."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [livecontainer, sidestore]
    scheme:
      gatherCoverageData: false
      testTargets:
        - QuantSwarmTests
        - QuantSwarmUITests
  QuantSwarmWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Widget
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantswarm.alphazero.widget
        PRODUCT_NAME: QuantSwarmWidget
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/QuantSwarmWidgetExtension.entitlements
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: Generated/WidgetInfo.plist
      properties:
        CFBundleDisplayName: QuantSwarm Status
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  QuantSwarmTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: QuantSwarmAlphaZero
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantswarm.alphazero.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  QuantSwarmUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: QuantSwarmAlphaZero
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantswarm.alphazero.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  QuantSwarmAlphaZero:
    build:
      targets:
        QuantSwarmAlphaZero: all
        QuantSwarmWidgetExtension: all
        QuantSwarmTests: [test]
        QuantSwarmUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuantSwarmTests
        - QuantSwarmUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
