name: Unsigned iOS IPA

on:
  push:
    branches: [main]
    # Solo quando cambia l'app: README, tools/ e backtest non consumano minuti Mac.
    paths:
      - "Sources/**"
      - "Tests/**"
      - "UITests/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      screenshot:
        description: "Fai anche gli screenshot dell'interfaccia"
        type: boolean
        default: false
      uitest:
        description: "Esegui anche i test dell'interfaccia (circa 4 minuti)"
        type: boolean
        default: true
      pubblica:
        description: "Pubblica la release (ultima, vX.Y.Z, aggiornamenti dall'app)"
        type: boolean
        default: false

permissions:
  contents: write

# Un push nuovo annulla i run vecchi ancora in coda: niente accumuli.
concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  build:
    # Macchina Apple Silicon: sul runner Intel i test dell'interfaccia restavano
    # fermi senza partire e l'intero giro durava circa il doppio.
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Serve Xcode 26: la build con Xcode 16.4 (default di questa immagine)
      # crasha all'avvio dopo il Face ID. Se Xcode 26 manca, la build fallisce
      # invece di pubblicare un IPA rotto.
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XC" || { echo "Xcode 26 non disponibile su questo runner"; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # Test automatici delle regole di rischio: se falliscono, niente IPA.
      # Test unitari (rischio, strategia, ciclo giornaliero): BLOCCANTI.
      - name: Run risk tests (simulatore)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "iOS" in k), reverse=True)
          for runtime in ios:
              for d in data[runtime]:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "Simulatore: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild \
            -project QuantSwarmAlphaZero.xcodeproj \
            -scheme QuantSwarmAlphaZero \
            -destination "id=$UDID" \
            -derivedDataPath "$PWD/DerivedDataTests" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
          xcodebuild \
            -project QuantSwarmAlphaZero.xcodeproj \
            -scheme QuantSwarmAlphaZero \
            -destination "id=$UDID" \
            -derivedDataPath "$PWD/DerivedDataTests" \
            -only-testing:QuantSwarmTests \
            test-without-building

      # Test dell'interfaccia: con riprova. Il simulatore Intel di GitHub a volte
      # non si avvia in tempo ("AX loaded notification"): in quel caso avviso,
      # senza bloccare l'IPA (i test unitari sopra restano bloccanti).
      # A ogni push solo i test unitari (veloci, bloccanti): i test
      # dell'interfaccia girano su richiesta (Run workflow) e prima delle release.
      - name: Run UI tests (simulatore)
        id: uitests
        if: github.event_name == 'workflow_dispatch' && inputs.uitest
        continue-on-error: true
        run: |
          # Ogni tentativo ha un tempo massimo di 8 minuti: nel run
          # 43556570498 xcodebuild è rimasto fermo 21 minuti senza far partire
          # nessun test e stava per consumare il tempo dell'intero job (niente
          # IPA). perl fa da timer: allo scadere il comando viene chiuso.
          run_ui() {
            perl -e 'alarm shift; exec @ARGV' 480 xcodebuild \
              -project QuantSwarmAlphaZero.xcodeproj \
              -scheme QuantSwarmAlphaZero \
              -destination "id=$SIM_UDID" \
              -derivedDataPath "$PWD/DerivedDataTests" \
              -only-testing:QuantSwarmUITests \
              -retry-tests-on-failure -test-iterations 2 \
              test-without-building
          }
          # Il primo avvio del runner dei test può scadere mentre il simulatore
          # carica l'accessibilità ("Timed out waiting for AX loaded
          # notification", run 43552818891): è il simulatore, non l'app, e in
          # quel caso nessun test parte. Si aspetta l'avvio completo e si
          # riprova una volta sola.
          xcrun simctl bootstatus "$SIM_UDID" -b || true
          run_ui || { echo "::notice::UI test: primo tentativo fallito, riprovo una volta"; sleep 45; run_ui; }

      - name: Avviso UI test
        if: steps.uitests.outcome == 'failure'
        run: |
          echo "::warning::UI test non superati, vedi log: controllare se è il simulatore o l'app."

      # Screenshot reali dell'interfaccia (dati di esempio, -QSPreview, solo
      # build debug): servono a controllare la grafica prima di consegnarla.
      - name: Screenshot interfaccia
        if: github.event_name == 'workflow_dispatch' && inputs.screenshot
        continue-on-error: true
        run: |
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryLevel 100 || true
          APP="$PWD/DerivedDataTests/Build/Products/Debug-iphonesimulator/QuantSwarmAlphaZero.app"
          xcrun simctl install "$SIM_UDID" "$APP"
          mkdir -p shots
          shot() {
            NAME="$1"; shift
            xcrun simctl terminate "$SIM_UDID" com.quantswarm.alphazero 2>/dev/null || true
            sleep 3
            xcrun simctl launch "$SIM_UDID" com.quantswarm.alphazero -QSPreview "$@" || echo "LAUNCH FALLITO $NAME"
            sleep 14
            xcrun simctl io "$SIM_UDID" screenshot "shots/$NAME.png"
            # Il simulatore Intel a volte è ancora sulla schermata di avvio
            # (bianca): seconda foto più tardi, tiene la più "pesante".
            sleep 8
            xcrun simctl io "$SIM_UDID" screenshot "shots/$NAME-2.png"
            if [ "$(stat -f%z "shots/$NAME-2.png")" -gt "$(stat -f%z "shots/$NAME.png")" ]; then
              mv "shots/$NAME-2.png" "shots/$NAME.png"
            else
              rm -f "shots/$NAME-2.png"
            fi
            if ! xcrun simctl spawn "$SIM_UDID" launchctl list | grep -q quantswarm; then
              echo "::warning::APP NON IN ESECUZIONE dopo $NAME (crash?)"
            fi
          }
          # Primo avvio a vuoto: il primo lancio dopo l'installazione è lento
          # (schermata bianca di avvio), non va fotografato.
          xcrun simctl launch "$SIM_UDID" com.quantswarm.alphazero -QSPreview || true
          sleep 20
          for TAB in CRUSCOTTO DETTAGLI BROKER SISTEMA; do shot "$TAB" -QSTab "$TAB"; done
          shot MERCATI -QSTab MERCATI
          shot GRAFICO -QSTab MERCATI -QSMarket XLF
          # Modalità CRYPTO: le 5 coppie in MERCATI e il grafico di una coppia.
          shot MERCATI-CRYPTO -QSCrypto -QSTab MERCATI
          shot GRAFICO-CRYPTO -QSCrypto -QSTab MERCATI -QSMarket BTC/USD
          ls -la shots
          echo "===== CRASH REPORT ====="
          find ~/Library/Logs/DiagnosticReports -name "QuantSwarm*" -mmin -30 2>/dev/null | while read f; do
            echo "--- $f"; head -c 6000 "$f"; echo
          done
          echo "===== LOG APP (errori) ====="
          xcrun simctl spawn "$SIM_UDID" log show --last 5m --style compact \
            --predicate 'process == "QuantSwarmAlphaZero" AND (messageType == error OR messageType == fault OR eventMessage CONTAINS[c] "fatal")' \
            2>/dev/null | grep -v CoreData | tail -60 || true

      - name: Pubblica screenshot (release "screenshot")
        if: github.event_name == 'workflow_dispatch' && inputs.screenshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots/*.png >/dev/null 2>&1 || exit 0
          for f in shots/*.png; do sips -Z 1400 "$f" >/dev/null; done
          # Branch "screenshot" (un commit sovrascritto ogni volta).
          D=$(mktemp -d)
          cp shots/*.png "$D/"
          cd "$D"
          git init -q -b screenshot
          git -c user.name="cipherdesk007-max" -c user.email="cipherdesk007@gmail.com" add .
          git -c user.name="cipherdesk007-max" -c user.email="cipherdesk007@gmail.com" commit -qm "Screenshot $GITHUB_SHA"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/screenshot

      - name: Build unsigned Release app
        run: |
          xcodebuild \
            -project QuantSwarmAlphaZero.xcodeproj \
            -scheme QuantSwarmAlphaZero \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/DerivedData/Build/Products/Release-iphoneos/QuantSwarmAlphaZero.app"
          test -d "$APP_PATH"
          mkdir -p Package/Payload
          ditto "$APP_PATH" "Package/Payload/QuantSwarmAlphaZero.app"
          cd Package
          zip -qry QuantSwarm-Alpha-Zero.ipa Payload
          unzip -t QuantSwarm-Alpha-Zero.ipa
          mv QuantSwarm-Alpha-Zero.ipa "$GITHUB_WORKSPACE/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: QuantSwarm-Alpha-Zero-unsigned
          path: QuantSwarm-Alpha-Zero.ipa
          if-no-files-found: error
          retention-days: 14

      # Come FMLAB: l'IPA esce direttamente nella release "ultima",
      # URL stabile per LiveContainer (Installa dall'URL) e aggiornamento sopra la vecchia.
      # Di default nessuna release: l'IPA va in una bozza privata (non visibile,
      # non installabile dal link) e viene consegnata a mano. Le release vere
      # partono solo con "pubblica" attivo.
      # Consegna dell'IPA non pubblicata: su un branch "bozza-ipa" (un solo
      # commit, sovrascritto ogni volta). Funziona anche se la creazione di
      # release è bloccata per il token delle Actions.
      - name: IPA sul branch bozza-ipa
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.pubblica) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          D=$(mktemp -d)
          cp QuantSwarm-Alpha-Zero.ipa "$D/"
          cd "$D"
          git init -q -b bozza-ipa
          git -c user.name="cipherdesk007-max" -c user.email="cipherdesk007@gmail.com" add QuantSwarm-Alpha-Zero.ipa
          git -c user.name="cipherdesk007-max" -c user.email="cipherdesk007@gmail.com" commit -qm "IPA $VERSION build $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/bozza-ipa

      - name: IPA in bozza privata
        continue-on-error: true
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.pubblica) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bozza-ipa --yes --cleanup-tag 2>/dev/null || true
          gh release create bozza-ipa QuantSwarm-Alpha-Zero.ipa --draft \
            --target "$GITHUB_SHA" --title "Bozza IPA (non pubblicata)" \
            --notes "Build $GITHUB_RUN_NUMBER · commit $GITHUB_SHA"

      - name: Pubblica release "ultima"
        if: github.event_name == 'workflow_dispatch' && inputs.pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag 2>/dev/null || true
          gh release create ultima QuantSwarm-Alpha-Zero.ipa \
            --target "$GITHUB_SHA" --latest \
            --title "FMLAB QuantSwarm Alpha Zero (ultima)" \
            --notes "IPA non firmato. LiveContainer → + → Installa dall'URL: https://github.com/cipherdesk007-max/agenti-trading/releases/download/ultima/QuantSwarm-Alpha-Zero.ipa — se la repo resta privata: scarica questo file e usa Installa da IPA. Commit: $GITHUB_SHA"


      # Release numerata (vX.Y.Z) con le note dal CHANGELOG: la storia delle
      # versioni resta su GitHub; "ultima" resta l'URL fisso per LiveContainer.
      - name: Pubblica release numerata
        if: github.event_name == 'workflow_dispatch' && inputs.pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v$VERSION"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Vedi CHANGELOG.md" > notes.md
          printf '\n\nBuild %s · commit %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" QuantSwarm-Alpha-Zero.ipa --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" QuantSwarm-Alpha-Zero.ipa --target "$GITHUB_SHA" \
              --title "FMLAB QuantSwarm Alpha Zero $VERSION" --notes-file notes.md --latest=false
          fi

      # Aggiornamenti dall'app: la stessa build sul repository PUBBLICO che
      # contiene solo IPA, icona e sorgente apps.json (LiveContainer/SideStore).
      # Serve il segreto RELEASES_TOKEN; se manca il passo viene saltato.
      - name: Pubblica per gli aggiornamenti dall'app
        if: github.event_name == 'workflow_dispatch' && inputs.pubblica
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::notice::RELEASES_TOKEN non impostato: aggiornamento dall'app non pubblicato."
            exit 0
          fi
          VERSION=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          python3 tools/publish_public.py "$VERSION" "$GITHUB_RUN_NUMBER" QuantSwarm-Alpha-Zero.ipa \
            Sources/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png notes.md
