name: Unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Un push nuovo annulla i run vecchi ancora in coda: niente accumuli.
concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned Release app
        run: |
          xcodebuild \
            -project QuantSwarmAlphaZero.xcodeproj \
            -scheme QuantSwarmAlphaZero \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/DerivedData/Build/Products/Release-iphoneos/QuantSwarmAlphaZero.app"
          test -d "$APP_PATH"
          mkdir -p Package/Payload
          ditto "$APP_PATH" "Package/Payload/QuantSwarmAlphaZero.app"
          cd Package
          zip -qry QuantSwarm-Alpha-Zero.ipa Payload
          unzip -t QuantSwarm-Alpha-Zero.ipa
          mv QuantSwarm-Alpha-Zero.ipa "$GITHUB_WORKSPACE/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: QuantSwarm-Alpha-Zero-unsigned
          path: QuantSwarm-Alpha-Zero.ipa
          if-no-files-found: error
          retention-days: 14

      # Come FMLAB: l'IPA esce direttamente nella release "ultima",
      # URL stabile per LiveContainer (Installa dall'URL) e aggiornamento sopra la vecchia.
      - name: Pubblica release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag 2>/dev/null || true
          gh release create ultima QuantSwarm-Alpha-Zero.ipa \
            --target "$GITHUB_SHA" --latest \
            --title "QuantSwarm Alpha Zero (ultima)" \
            --notes "IPA non firmato. LiveContainer → + → Installa dall'URL: https://github.com/cipherdesk007-max/agenti-trading/releases/download/ultima/QuantSwarm-Alpha-Zero.ipa — se la repo resta privata: scarica questo file e usa Installa da IPA. Commit: $GITHUB_SHA"
