name: Backtest filtro

on:
  workflow_dispatch:
    inputs:
      quale:
        description: "tutti | intraday15 | giornaliero | veloce5m | app | piccolo | momentum | overnight"
        default: "tutti"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      Q: ${{ github.event.inputs.quale || 'tutti' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Filtro app 15m (costi 0,03% e 0,005%)
        if: env.Q == 'tutti' || env.Q == 'intraday15'
        run: |
          python tools/backtest.py | tee -a backtest.md
          BT_COST=0.00005 python tools/backtest.py | tee -a backtest.md
      - name: Giornaliero ETF 2006-oggi
        if: env.Q == 'tutti' || env.Q == 'giornaliero'
        run: python tools/backtest_daily.py | tee -a backtest.md
      - name: Veloce 5m ORB/VWAP (costi 0,02% e 0,005%)
        if: env.Q == 'tutti' || env.Q == 'veloce5m'
        run: |
          python tools/backtest_intraday.py | tee -a backtest.md
          BT_COST=0.00005 python tools/backtest_intraday.py | tee -a backtest.md
      - name: Regole esatte dell'app (giornaliera) + robustezza
        if: env.Q == 'tutti' || env.Q == 'app'
        run: python tools/backtest_app.py | tee -a backtest.md
      - name: Conto piccolo (azioni intere ai prezzi di oggi, gemelli economici)
        if: env.Q == 'tutti' || env.Q == 'piccolo'
        working-directory: tools
        run: python backtest_small.py | tee -a ../backtest.md
      - name: Intraday momentum (prima ora → ultima mezz'ora)
        if: env.Q == 'tutti' || env.Q == 'momentum'
        run: python tools/backtest_momentum.py | tee -a backtest.md
      - name: Overnight e rimbalzo di fine giornata
        if: env.Q == 'tutti' || env.Q == 'overnight'
        run: python tools/backtest_overnight.py | tee -a backtest.md
      - run: cat backtest.md >> "$GITHUB_STEP_SUMMARY"
