name: Backtest filtro

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Backtest (costi realistici 0,03% per lato)
        run: python tools/backtest.py | tee backtest.md
      - name: Backtest (costi quasi nulli 0,005% per lato)
        run: BT_COST=0.00005 python tools/backtest.py | tee -a backtest.md
      - name: Backtest giornaliero ETF 2006-oggi
        run: python tools/backtest_daily.py | tee -a backtest.md
      - run: cat backtest.md >> "$GITHUB_STEP_SUMMARY"
