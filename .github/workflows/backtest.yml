name: Backtest filtro

on:
  # Controllo mensile automatico: le strategie funzionano ancora sui dati recenti?
  # (1° del mese, 07:17 UTC). Risultati nel riepilogo del run.
  schedule:
    - cron: "17 7 1 * *"
  workflow_dispatch:
    inputs:
      quale:
        description: "tutti | intraday15 | giornaliero | veloce5m | app | piccolo | momentum | overnight | segnali | oggi | studi | robustezza | portafoglio | crypto | cryptotrend"
        default: "tutti"

# pipefail: se uno script va in errore il passo FALLISCE anche se il tee ha scritto
# l'output (prima "| tee" nascondeva l'errore e le tabelle restavano vuote).
defaults:
  run:
    shell: bash -e -o pipefail {0}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      Q: ${{ github.event.inputs.quale || 'mensile' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Filtro app 15m (costi 0,03% e 0,005%)
        if: env.Q == 'tutti' || env.Q == 'intraday15'
        run: |
          python tools/backtest.py | tee -a backtest.md
          BT_COST=0.00005 python tools/backtest.py | tee -a backtest.md
      - name: Giornaliero ETF 2006-oggi
        if: env.Q == 'tutti' || env.Q == 'giornaliero'
        run: python tools/backtest_daily.py | tee -a backtest.md
      - name: Veloce 5m ORB/VWAP (costi 0,02% e 0,005%)
        if: env.Q == 'tutti' || env.Q == 'veloce5m'
        run: |
          python tools/backtest_intraday.py | tee -a backtest.md
          BT_COST=0.00005 python tools/backtest_intraday.py | tee -a backtest.md
      - name: Regole esatte dell'app (giornaliera) + robustezza
        if: env.Q == 'tutti' || env.Q == 'app' || env.Q == 'mensile'
        run: python tools/backtest_app.py | tee -a backtest.md
      - name: Conto piccolo (azioni intere ai prezzi di oggi, gemelli economici)
        if: env.Q == 'tutti' || env.Q == 'piccolo' || env.Q == 'mensile'
        working-directory: tools
        run: python backtest_small.py | tee -a ../backtest.md
      - name: Intraday momentum (prima ora → ultima mezz'ora)
        if: env.Q == 'tutti' || env.Q == 'momentum'
        run: python tools/backtest_momentum.py | tee -a backtest.md
      - name: Overnight e rimbalzo di fine giornata
        if: env.Q == 'tutti' || env.Q == 'overnight' || env.Q == 'mensile'
        run: |
          python tools/backtest_overnight.py | tee -a backtest.md
          python tools/backtest_overnight_fraction.py | tee -a backtest.md
      - name: Overnight con prezzi d'asta reali (senza chiavi in env stampa solo una nota)
        if: env.Q == 'tutti' || env.Q == 'overnight' || env.Q == 'mensile'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python tools/backtest_overnight_auctions.py | tee -a backtest.md
      - name: Batteria di regole giornaliere
        if: env.Q == 'tutti' || env.Q == 'segnali'
        working-directory: tools
        run: python backtest_signals.py | tee -a ../backtest.md
      - name: Segnali di oggi (controllo indipendente)
        if: env.Q == 'oggi'
        run: python tools/oggi.py | tee -a backtest.md
      - name: STUDI (solo analisi, non cambiano l'app) — trailing stop, risk-parity NOTTE, filtro evento 48h, filtro VIX
        if: env.Q == 'studi'
        working-directory: tools
        run: |
          python backtest_trailing_stop.py | tee -a ../backtest.md
          python backtest_overnight_riskparity.py | tee -a ../backtest.md
          python backtest_event_filter.py | tee -a ../backtest.md
          python backtest_vix_filter.py | tee -a ../backtest.md
      # STUDIO conto unico: GIORNALIERA + NOTTE come budget sullo stesso conto
      # (idea del proprietario: una sola modalità non-veloce). Non cambia l'app.
      - name: Portafoglio combinato GIORNALIERA + NOTTE (studio conto unico)
        if: env.Q == 'tutti' || env.Q == 'studi' || env.Q == 'portafoglio'
        working-directory: tools
        run: python backtest_portfolio.py | tee -a ../backtest.md
      # STUDIO crypto 24/7 (solo analisi, non cambia l'app): RSI2<EMA100 + stop/TP ATR su 1D/4H/1H
      - name: Studio crypto mean-reversion (solo analisi)
        if: env.Q == 'tutti' || env.Q == 'studi' || env.Q == 'crypto'
        working-directory: tools
        run: python backtest_crypto.py | tee -a ../backtest.md
      # STUDIO crypto trend a regime (solo analisi): regole NUOVE dopo il bando della
      # proposta 18. Long-only senza TP fisso, criteri pre-registrati nello script.
      - name: Studio crypto trend a regime (solo analisi)
        if: env.Q == 'tutti' || env.Q == 'studi' || env.Q == 'cryptotrend'
        working-directory: tools
        run: |
          python backtest_trend_crypto.py | tee -a ../backtest.md
          BT_COST=0.001 python backtest_trend_crypto.py | tee -a ../backtest.md
      # FASE 5: walk-forward out-of-sample, Monte Carlo, Sortino/profit
      # factor/expectancy/R-multiplo. Non cambia l'app: misura le regole attuali.
      - name: Robustezza (walk-forward + Monte Carlo + metriche complete)
        if: env.Q == 'tutti' || env.Q == 'robustezza' || env.Q == 'mensile'
        run: python tools/backtest_robustness.py | tee -a backtest.md
      - run: cat backtest.md >> "$GITHUB_STEP_SUMMARY"
